<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/barcelos-rooster.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GitHub Pages SPA: restore path from ?p= query param set by 404.html -->
    <script>
      (function() {
        var redirect = window.location.search;
        if (redirect.startsWith('?p=')) {
          var path = decodeURIComponent(redirect.slice(3));
          // Preserve any additional query params or hash after the encoded path
          var rest = redirect.indexOf('&') !== -1
            ? redirect.slice(redirect.indexOf('&'))
            : '';
          window.history.replaceState(
            null, null,
            path + rest + window.location.hash
          );
        }
      })();
    </script>
    
    <!-- SEO Meta Tags — <title>/meta description/canonical/hreflang are also
         updated per-route by <SEOMeta> (src/components/SEOMeta.jsx) via
         react-helmet-async, for JS-executing crawlers (Googlebot) and the
         browser tab. Open Graph / Twitter Card tags stay static and ARE NOT
         duplicated by SEOMeta: social share scrapers (Facebook, X, LinkedIn,
         WhatsApp, Slack, iMessage, etc.) never execute JavaScript, so these
         tags are the only ones they will ever see — for any URL, since this
         is a client-rendered SPA with no server-side rendering. -->
    <title>Multi Lingo AI | Learn any language with AI</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://multi-lingo.online/" />
    <meta property="og:title" content="Multi Lingo AI | Learn European Portuguese with AI" />
    <meta property="og:description" content="The first AI powered platform that teaches you European Portuguese from any language or dialect you speak. Available in English, Portuguese, Spanish, French, and German. AI-powered, human-supported." />
    <meta property="og:image" content="https://multi-lingo.online/barcelos-rooster-og.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_PT" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://multi-lingo.online/" />
    <meta property="twitter:title" content="Multi Lingo AI | Learn European Portuguese with AI" />
    <meta property="twitter:description" content="The first AI powered platform that teaches you European Portuguese from any language or dialect you speak. Available in English, Portuguese, Spanish, French, and German. AI-powered, human-supported." />
    <meta property="twitter:image" content="https://multi-lingo.online/barcelos-rooster-og.png" />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Multi Lingo AI",
      "url": "https://multi-lingo.online",
      "description": "The first AI-powered platform that teaches you any language from any dialect you speak.",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
