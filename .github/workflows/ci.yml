name: CI

on:
  push:
  pull_request:
    branches-ignore:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reports but never blocks, unlike the identical step in the API repo.
      # There, a red CI costs nothing — Vercel deploys from its own git
      # integration. Here, deploy-prod waits on CI succeeding, so a failing
      # audit would freeze every deploy until an upstream fix landed, which
      # is too much power to hand a transitive advisory in someone else's
      # dependency tree.
      #
      # Placed before lint on purpose: a step after a failing one never runs,
      # and the whole point is to get the report every time.
      #
      # npm audit prints the full report whatever --audit-level is set to;
      # the flag only decides the exit code. So moderate findings show up in
      # the log with a green tick, and high or critical ones get the amber
      # "step failed but continued" marker that is worth going to look at.
      - name: Dependency vulnerability audit (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ""
          VITE_FIREBASE_AUTH_DOMAIN: ""
          VITE_FIREBASE_PROJECT_ID: ""
          VITE_FIREBASE_STORAGE_BUCKET: ""
          VITE_FIREBASE_MESSAGING_SENDER_ID: ""
          VITE_FIREBASE_APP_ID: ""
          VITE_PROXY_URL: ""
          VITE_FIREBASE_VAPID_KEY: ""
          VITE_SENTRY_DSN: ""
